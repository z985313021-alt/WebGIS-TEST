# 遗蕴齐鲁 · WebGIS 站点配置
# 放置位置：/etc/nginx/sites-available/webgis  （再软链到 sites-enabled/）
# 说明：node 只监听回环，公网流量全部经 nginx；静态资源由此托管，/api 反代到 Node。

# 限流区（放在 http {} 块内；若单独成文件，用 include 引入）
# limit_req_zone $binary_remote_addr zone=webgis_api:10m rate=20r/s;
# limit_req_zone $binary_remote_addr zone=webgis_tiles:10m rate=80r/s;

server {
    listen 80;
    server_name _;                     # 有域名后替换为实际域名

    root /opt/webgis/dist;
    index index.html;

    # 上传体积与后端 multer 上限保持一致（20MB × 5）
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 带哈希指纹的静态资源：长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 地图瓦片代理：请求密集，用更宽松的限流
    location /api/tianditu/ {
        limit_req zone=webgis_tiles burst=120 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # 瓦片可以被浏览器缓存一小会儿，减轻回源
        expires 1h;
    }

    # 其余接口：常规限流 + 交给 Node 自己再做一层细粒度限流
    location /api/ {
        limit_req zone=webgis_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;       # 文件转换/高德调用偶发较慢
    }

    # 前端单页应用：未命中的路径一律回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
